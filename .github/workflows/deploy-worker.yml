name: Deploy IPOWatch Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Wrangler environment to deploy"
        type: choice
        required: true
        default: "preview"
        options:
          - preview
          - production

concurrency:
  group: ipo-watch-worker-deploy-${{ github.event.inputs.environment || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets missing; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before deploying."
            exit 1
          fi

      - name: V3 quality gate
        run: python scripts/audit_v3_quality.py --site-root data/ipo_watch_v3 --gate

      - name: Prospectus facts gate
        run: python scripts/audit_prospectus_facts.py --site-root data/ipo_watch_v3 --gate

      - name: Source structure gate
        run: python -m ipo_portal.orchestrator audit-source-structure --gate

      - name: Publish safety guard
        run: python scripts/guard_publish_v3.py --skip-refresh-summary

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build Astro site from V3
        working-directory: web
        run: npm run build

      - name: Wrangler dry run
        working-directory: web
        run: npm run cf:preview

      - name: Deploy preview Worker
        if: ${{ github.event.inputs.environment == 'preview' }}
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy

      - name: Deploy production Worker
        if: ${{ github.event.inputs.environment == 'production' }}
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy:production
