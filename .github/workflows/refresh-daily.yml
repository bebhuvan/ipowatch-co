name: Refresh IPOWatch V3 daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

concurrency:
  group: ipo-watch-v3-refresh
  cancel-in-progress: false

jobs:
  refresh-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Hoisted to job level so it can be referenced from a step `if:` — the
    # `secrets` context is not allowed inside `if:` expressions (doing so is a
    # workflow startup error that fails the run on every event, including push).
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Refresh V3 data
        run: python -m ipo_portal.orchestrator refresh-daily --skip-kite --skip-yahoo --skip-tijori --skip-enrich

      - name: Refresh capital-raising stats (IndiaDataHub)
        continue-on-error: true
        env:
          INDIA_DATAHUB_API_KEY: ${{ secrets.INDIA_DATAHUB_API_KEY }}
        run: python -m ipo_portal.datahub

      - name: V3 quality gate
        run: python scripts/audit_v3_quality.py --site-root data/ipo_watch_v3 --gate

      - name: Prospectus facts gate
        run: python scripts/audit_prospectus_facts.py --site-root data/ipo_watch_v3 --gate

      - name: Source structure gate
        run: python -m ipo_portal.orchestrator audit-source-structure --gate

      # Generate research reports for any filing whose extraction is new or
      # updated. Idempotent (the --pending work-list is empty when nothing
      # changed) and resilient (a hiccup here must never block the daily data
      # refresh or deploy). Reports that clear the fact-check gate render as
      # status=published; the rest land as status=review and stay unlisted.
      - name: Generate pending IPO research reports
        if: env.DEEPSEEK_API_KEY != ''
        continue-on-error: true
        env:
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: python -m ipo_portal.orchestrator.ipo_report --pending

      - name: Build Astro site from V3
        working-directory: web
        run: npm run build

      - name: Publish safety guard
        run: python scripts/guard_publish_v3.py

      - name: Commit refreshed V3 dataset
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add data/derived
          git add data/ipo_watch_v3 data/site_v3
          git add data/ipo_reports web/src/content/ipo-reports
          git add -f data/reports/latest_refresh_summary.json data/reports/primary_source_structure_audit.json data/reports/prospectus_facts_quality.json
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit."
            exit 0
          fi
          stamp="$(date -u +'%Y-%m-%dT%H:%MZ')"
          git commit -m "chore(data): refresh IPOWatch V3 daily at ${stamp}"
          git pull --rebase origin main
          git push

      - name: Check Cloudflare secrets
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare secrets missing; skipping deploy."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wrangler dry run
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: web
        run: npm run cf:preview

      - name: Deploy production Worker
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy:production

      - name: Upload refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-watch-v3-daily-${{ github.run_id }}
          path: |
            data/raw
            data/derived
            data/reports
            data/ipo_watch_v3/_meta
          retention-days: 14
          if-no-files-found: ignore
