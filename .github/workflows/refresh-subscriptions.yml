name: Refresh IPOWatch V3 subscriptions

on:
  workflow_dispatch:
  schedule:
    # Market-day intraday cadence in India. GitHub cron is UTC.
    - cron: "*/15 4-11 * * 1-5"

concurrency:
  group: ipo-watch-v3-subscriptions
  cancel-in-progress: false

jobs:
  refresh-subscriptions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Refresh active subscription data
        run: python -m ipo_portal.orchestrator refresh-subscriptions

      - name: V3 quality gate
        run: python scripts/audit_v3_quality.py --site-root data/ipo_watch_v3 --gate

      - name: Build Astro site from V3
        working-directory: web
        run: npm run build

      - name: Publish safety guard
        run: python scripts/guard_publish_v3.py

      - name: Commit subscription delta
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add data/ipo_watch_v3 data/site_v3
          if git diff --cached --quiet; then
            echo "No subscription changes; skipping commit."
            exit 0
          fi
          stamp="$(date -u +'%Y-%m-%dT%H:%MZ')"
          git commit -m "chore(data): refresh IPO subscriptions at ${stamp}"
          git pull --rebase origin main
          git push

      - name: Check Cloudflare secrets
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare secrets missing; skipping deploy."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wrangler dry run
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: web
        run: npm run cf:preview

      - name: Deploy production Worker
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy:production

      - name: Upload refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-watch-v3-subscriptions-${{ github.run_id }}
          path: |
            data/reports
            data/ipo_watch_v3/_meta
          retention-days: 14
          if-no-files-found: ignore
