name: Refresh Tijori enrichment

on:
  workflow_dispatch:
  schedule:
    # Before the daily V3 reconciliation. GitHub cron is UTC; 00:45 UTC = 06:15 IST.
    - cron: "45 0 * * 1-5"

concurrency:
  group: ipo-watch-tijori-enrichment
  cancel-in-progress: false

jobs:
  refresh-tijori-enrichment:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh Tijori enrichment snapshot
        run: python -m ipo_portal.orchestrator refresh-tijori-enrichment

      - name: Commit Tijori enrichment
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add data/derived/tijori_ipo_enrichment.json data/derived/sector_map.json
          git add -f data/raw/tijori data/reports/latest_tijori_refresh.json
          if git diff --cached --quiet; then
            echo "No Tijori enrichment changes; skipping commit."
            exit 0
          fi
          stamp="$(date -u +'%Y-%m-%dT%H:%MZ')"
          git commit -m "chore(data): refresh Tijori enrichment at ${stamp}"
          git pull --rebase origin main
          git push

      - name: Upload Tijori diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-watch-tijori-enrichment-${{ github.run_id }}
          path: |
            data/raw/tijori
            data/derived/tijori_ipo_enrichment.json
            data/reports/latest_tijori_refresh.json
          retention-days: 14
          if-no-files-found: ignore
