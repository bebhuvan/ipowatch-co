name: Refresh Yahoo market data

on:
  workflow_dispatch:
  schedule:
    # After Indian market close. GitHub cron is UTC; 12:30 UTC = 18:00 IST.
    - cron: "30 12 * * 1-5"

concurrency:
  group: ipo-watch-yahoo-market
  cancel-in-progress: false

jobs:
  refresh-yahoo-market:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh Yahoo market snapshot
        run: python -m ipo_portal.orchestrator refresh-yahoo-market

      - name: Commit Yahoo market snapshot
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git restore data/reports/latest_refresh_summary.json || true
          rm -f data/reports/refresh_runs.jsonl
          git add -f data/raw/yahoo data/reports/latest_yahoo_market_refresh.json
          if git diff --cached --quiet; then
            echo "No Yahoo market changes; skipping commit."
            exit 0
          fi
          stamp="$(date -u +'%Y-%m-%dT%H:%MZ')"
          git commit -m "chore(data): refresh Yahoo market snapshot at ${stamp}"
          git pull --rebase origin main
          git push

      - name: Upload Yahoo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipo-watch-yahoo-market-${{ github.run_id }}
          path: |
            data/raw/yahoo
            data/reports/latest_yahoo_market_refresh.json
          retention-days: 14
          if-no-files-found: ignore
