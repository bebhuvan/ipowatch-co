<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IPO Watch">
  <!-- Eye outline — watching the market -->
  <path d="M7 32C14 21 23 16 32 16S50 21 57 32C50 43 41 48 32 48S14 43 7 32Z"
        fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Chart line inside the eye -->
  <path d="M19 38L28 30L35 34L45 23"
        fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Accent peak — the high point -->
  <circle cx="45" cy="23" r="4" fill="#e8765a"/>
</svg>
